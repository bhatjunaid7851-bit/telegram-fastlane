name: Build Telegram Fast-Lane APK

on:
  push:
    branches: [rewrite, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Telegram Fast-Lane Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free Runner Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy
          df -h

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v4

      - name: Install Android Build-Tools and NDK
        run: |
          sdkmanager --install "platforms;android-33" "build-tools;33.0.1" "ndk;21.4.7075529" "cmake;3.22.1"

      - name: Setup Release Keystore & API_KEYS
        run: |
          mkdir -p TMessagesProj/config/release
          cp -f TMessagesProj/config/extera.jks TMessagesProj/config/release/release.jks
          
          cat > API_KEYS << 'EOF'
          APP_ID=6
          APP_HASH="eb06d4abfb49dc3eeb1aeb98ae0f581e"
          MAPS_V2_API=""
          SIGNING_KEY_PASSWORD=fastlane
          SIGNING_KEY_ALIAS=fastlane
          SIGNING_KEY_STORE_PASSWORD=fastlane
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Arm64 Release APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx6144m -XX:MaxMetaspaceSize=1024m" -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=4
        run: |
          ./gradlew assembleArm64Release --no-daemon --parallel --stacktrace

      - name: Publish Fast-Lane APK to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="tg-fastlane-$(date +%s)"
          ARM64_APK=$(find TMessagesProj/build/outputs/apk/ -name "*arm64*release*.apk" -o -name "*arm64*.apk" | head -n 1)
          if [ -z "$ARM64_APK" ]; then
            ARM64_APK=$(find TMessagesProj/build/outputs/apk/ -name "*.apk" | head -n 1)
          fi
          echo "Found Arm64 APK: $ARM64_APK"
          ls -lh "$ARM64_APK"
          gh release create "$TAG_NAME" "$ARM64_APK" \
            --title "Telegram Fast-Lane ($TAG_NAME)" \
            --notes "Telegram Fast-Lane production release: Continuous auto-reaction loop (500-2000ms poll slider), 0-4000ms continuous series delay slider, dual direct relay (srv1598644 + t2.autoclaimer.in), zero OCR media bypass, persistent release signing."
