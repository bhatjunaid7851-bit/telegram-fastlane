name: Build Telegram Fast-Lane APK

on:
  push:
    branches: [rewrite, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Telegram Fast-Lane Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Free Runner Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy
          df -h

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build-Tools and NDK
        run: |
          sdkmanager --install "platforms;android-33" "build-tools;33.0.1" "ndk;21.4.7075529" "cmake;3.22.1"

      - name: Generate Self-Signed Release Keystore & API_KEYS
        run: |
          keytool -genkeypair -v -keystore TMessagesProj/config/release/release.jks \
            -alias fastlane -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass fastlane -keypass fastlane \
            -dname "CN=TelegramFastlane, OU=FastLane, O=TG, L=Singapore, S=SG, C=SG"
          
          cat > API_KEYS << 'EOF'
          APP_ID = 6
          APP_HASH = "eb06d4abfb49dc3eeb1aeb98ae0f581e"
          MAPS_V2_API = ""
          SIGNING_KEY_PASSWORD = fastlane
          SIGNING_KEY_ALIAS = fastlane
          SIGNING_KEY_STORE_PASSWORD = fastlane
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Arm64 & Afat Release APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: |
          ./gradlew assembleArm64Release assembleAfatRelease --no-daemon --stacktrace

      - name: Publish Fast-Lane APK to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="tg-fastlane-$(date +%s)"
          ARM64_APK=$(find TMessagesProj/build/outputs/apk/arm64/release/ -name "*.apk" | head -n 1)
          AFAT_APK=$(find TMessagesProj/build/outputs/apk/afat/release/ -name "*.apk" | head -n 1)
          echo "Found Arm64 APK: $ARM64_APK"
          echo "Found Afat APK: $AFAT_APK"
          ls -lh $ARM64_APK $AFAT_APK
          gh release create "$TAG_NAME" "$ARM64_APK" "$AFAT_APK" \
            --title "Telegram Fast-Lane ($TAG_NAME)" \
            --notes "Custom Official Telegram client for OnePlus 15R / Android 16 with sub-millisecond gift code extraction, auto-reactions, and instant IPC."
